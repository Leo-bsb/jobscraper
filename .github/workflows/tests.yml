name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Só o necessário para os testes (unittest + openpyxl).
      # pandas/jobspy/playwright/google-genai NÃO são instalados de propósito:
      # os testes não podem depender de rede nem de navegador.
      - name: Instalar dependências mínimas
        run: pip install openpyxl
      - name: Rodar os testes
        run: python -m unittest discover -s tests -t .
